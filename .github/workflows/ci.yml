name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a running check when the same ref is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # The app reads these at module load; the build never connects to a
          # database, so throwaway values are enough to get a production build.
          MONGODB_URI: mongodb://127.0.0.1:27017/courier_ops_ci
          AUTH_SECRET: ci-build-only-secret-not-used-at-runtime-00000

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
